[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-bike-demand-forecasting"
version = "1.0.0"
description = "Thirty-day daily bike demand forecasting with honest time-series validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sagarmandavkar-UX"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "jupyter>=1.0,<2",
  "nbformat>=5.9,<6",
  "nbclient>=0.10,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

